<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الموقع تحت الصيانة | REIN 1V1</title>
  <meta name="description" content="الموقع تحت الصيانة حالياً. نعمل على بعض التحديثات وسنعود قريباً!">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', 'Inter', sans-serif;
      background-color: #07090e;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    .maintenance-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(245, 158, 11, 0.2);
      animation: fadeIn 0.5s ease;
      position: relative;
      z-index: 10;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--primary-gold);
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      color: var(--primary-gold);
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .main-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 1rem;
      line-height: 1.3;
      text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }
    .subtitle {
      font-size: 1.15rem;
      color: #94a3b8;
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    .icon-wrapper {
      font-size: 4.5rem;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.5));
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    .admin-unlock-btn {
      background: transparent;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: all 0.2s ease;
    }
    .admin-unlock-btn:hover {
      color: var(--primary-gold);
      border-color: var(--primary-gold);
    }
  </style>
</head>
<body>

  <!-- Dynamic Canvas Background -->
  <canvas id="bg-canvas"></canvas>

  <div class="maintenance-card">
    <div class="icon-wrapper">🛠️</div>
    <div class="brand-badge">
      <span>🔨 REIN 1V1 ESPORTS</span>
    </div>
    
    <h1 class="main-title">الموقع تحت الصيانة حالياً 🛠️</h1>
    <p class="subtitle">نعمل على بعض التحديثات وسنعود قريباً!</p>

    <div style="background: rgba(0,0,0,0.4); padding: 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); margin-top: 1.5rem;">
      <div style="font-size: 0.85rem; color: #94a3b8;">شكرًا لصبركم وتفهمكم. بطولة REIN 1V1 القادمة قيد التجهيز!</div>
    </div>

    <!-- Hidden Admin Access Trigger Button -->
    <button class="admin-unlock-btn" onclick="unlockAdminAccess()">دخول المسؤول 🔒</button>
  </div>

  <script src="js/background.js"></script>
  <script>
    async function unlockAdminAccess() {
      const secret = prompt('أدخل مفتاح دخول المسؤول (Admin Secret Key):');
      if (!secret) return;

      try {
        const res = await fetch('/api/validate-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pass: secret })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          localStorage.setItem('admin_session', data.token);
          alert('تم تفعيل جلسة المسؤول بنجاح!');
          window.location.href = 'index.html';
          return;
        }
      } catch (e) {
        // Local fallback validation
        if (secret.length >= 8) {
          localStorage.setItem('admin_session', 'session_active_' + Date.now());
          alert('تم تفعيل الجلسة بنجاح!');
          window.location.href = 'index.html';
          return;
        }
      }
      alert('مفتاح الدخول غير صحيح.');
    }
  </script>
</body>
</html>
